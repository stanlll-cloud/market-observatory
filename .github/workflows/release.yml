name: Build & Release Desktop Apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 (.exe & .zip)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Package MarketObservatory-Win64.exe
        shell: pwsh
        run: |
          if (Test-Path "frontend/dist/downloads") {
            Remove-Item -Recurse -Force "frontend/dist/downloads"
          }
          pyinstaller --noconfirm --clean --noconsole --onefile `
            --name "MarketObservatory-Win64" `
            --icon "windows-app/app.ico" `
            --paths "backend" `
            --add-data "frontend/dist;frontend/dist" `
            --add-data "windows-app/app.ico;windows-app" `
            --collect-submodules "uvicorn" `
            --collect-submodules "anyio" `
            --collect-data "tzdata" `
            --collect-data "certifi" `
            --hidden-import "main" `
            --hidden-import "market_data" `
            --hidden-import "structure_engine" `
            --hidden-import "radar_engine" `
            --hidden-import "calendar_engine" `
            --hidden-import "macro_intel" `
            windows-app/win_launcher.py

      - name: Run Windows smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\dist\MarketObservatory-Win64.exe" -ArgumentList "--headless-check","--check-log","headless_check.log" -Wait -PassThru
          if (Test-Path "headless_check.log") {
            Get-Content "headless_check.log"
          } else {
            Write-Host "No headless_check.log produced (exit=$($p.ExitCode))"
          }
          $logText = if (Test-Path "headless_check.log") { Get-Content "headless_check.log" -Raw } else { "" }
          if ($p.ExitCode -ne 0 -or ($logText -notmatch "SELF_TEST_OK")) {
            throw "Windows headless check failed (exit=$($p.ExitCode))"
          }

      - name: Create portable Windows ZIP bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "win_pkg" | Out-Null
          Copy-Item "dist/MarketObservatory-Win64.exe" "win_pkg/"
          Copy-Item "start_windows.bat" "win_pkg/"
          Copy-Item "README.md" "win_pkg/"
          Compress-Archive -Path "win_pkg/*" -DestinationPath "dist/MarketObservatory-Windows-x64.zip" -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: |
            dist/MarketObservatory-Win64.exe
            dist/MarketObservatory-Windows-x64.zip

  build-macos:
    name: Build macOS Desktop App (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build
          rm -rf dist/downloads

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Build embedded backend obs-server
        run: |
          pyinstaller --noconfirm --clean --onedir \
            --name "obs-server" \
            --paths "backend" \
            --add-data "frontend/dist:frontend/dist" \
            --collect-submodules "uvicorn" \
            --collect-submodules "anyio" \
            --collect-data "tzdata" \
            --collect-data "certifi" \
            --hidden-import "main" \
            --hidden-import "market_data" \
            --hidden-import "structure_engine" \
            --hidden-import "radar_engine" \
            --hidden-import "calendar_engine" \
            --hidden-import "macro_intel" \
            windows-app/win_launcher.py

      - name: Run embedded backend smoke test
        run: |
          ./dist/obs-server/obs-server --headless-check | grep -q "SELF_TEST_OK"

      - name: Assemble macOS .app and MarketObservatory-Mac.dmg
        run: |
          ICONSET="macos-app/AppIcon.iconset"
          mkdir -p "$ICONSET"
          sips -z 16 16     macos-app/icon_1024.png --out "$ICONSET/icon_16x16.png" >/dev/null
          sips -z 32 32     macos-app/icon_1024.png --out "$ICONSET/icon_16x16@2x.png" >/dev/null
          sips -z 32 32     macos-app/icon_1024.png --out "$ICONSET/icon_32x32.png" >/dev/null
          sips -z 64 64     macos-app/icon_1024.png --out "$ICONSET/icon_32x32@2x.png" >/dev/null
          sips -z 128 128   macos-app/icon_1024.png --out "$ICONSET/icon_128x128.png" >/dev/null
          sips -z 256 256   macos-app/icon_1024.png --out "$ICONSET/icon_128x128@2x.png" >/dev/null
          sips -z 256 256   macos-app/icon_1024.png --out "$ICONSET/icon_256x256.png" >/dev/null
          sips -z 512 512   macos-app/icon_1024.png --out "$ICONSET/icon_256x256@2x.png" >/dev/null
          sips -z 512 512   macos-app/icon_1024.png --out "$ICONSET/icon_512x512.png" >/dev/null
          cp macos-app/icon_1024.png "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o "macos-app/AppIcon.icns"

          APP_DIR="dist/观势 Market Observatory.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          cp macos-app/Info.plist "$APP_DIR/Contents/Info.plist"
          cp macos-app/AppIcon.icns "$APP_DIR/Contents/Resources/AppIcon.icns"
          cp -R dist/obs-server "$APP_DIR/Contents/Resources/obs-server"
          swiftc -O macos-app/main.swift -o "$APP_DIR/Contents/MacOS/MarketObservatory"
          chmod +x "$APP_DIR/Contents/MacOS/MarketObservatory" "$APP_DIR/Contents/Resources/obs-server/obs-server"

          find "$APP_DIR/Contents/Resources/obs-server" -type f \( -name "*.dylib" -o -name "*.so" -o -perm +111 \) -exec codesign --force -s - {} +
          codesign --force --deep -s - "$APP_DIR"

          mkdir -p dmg_stage
          cp -R "$APP_DIR" dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "观势 Market Observatory" -srcfolder dmg_stage -ov -format UDZO "dist/MarketObservatory-Mac.dmg"

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          path: dist/MarketObservatory-Mac.dmg

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v2.0.0' }}
          name: "观势 Market Observatory ${{ github.ref_name || 'v2.0.0' }}"
          generate_release_notes: true
          files: release-assets/*
          body: |
            ## 📈 观势 · Market Observatory 跨平台独立桌面版

            > **免费开源 · 免装 Python / Node · 本地直连实时行情**
            > 集成：**美股盘前盘后 1 分钟级实时行情 · 加密货币现货 · 缠论自动笔/线段/中枢/背驰 · EMA20/60 均线扣抵 · 筹码峰 VPVR · 64 标的量化雷达 · 宏观/财报避雷日历**

            ### ⬇️ 客户端下载
            - 🪟 **Windows 10/11 单文件免安装版**：`MarketObservatory-Win64.exe`（或下载包含启动脚本的 `MarketObservatory-Windows-x64.zip`）
            - 🍎 **macOS Apple Silicon 原生客户端**：`MarketObservatory-Mac.dmg`（拖入 `Applications`，首次打开右键点「打开」放行）

